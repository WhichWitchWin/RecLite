name: 缺陷报告
description: 程序行为与说明不符、出错或崩溃
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先在 Issues 里搜一下有没有相同问题。
        安全漏洞请**不要**在这里提交，见 [SECURITY.md](https://github.com/WhichWitchWin/RecLite/blob/main/SECURITY.md)。

  - type: input
    id: version
    attributes:
      label: RecLite 版本
      description: 下载的 Release 版本号，或程序标题栏显示的版本
      placeholder: 0.2.2
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 / Windows 10 1903
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 涉及的音频设备
      description: 声卡/接口型号与采样率，例如 RME Babyface Pro（48 kHz）
      placeholder: 设备型号 + 采样率

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你期望发生什么，实际发生了什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择设备 …
        2. 按录音，等 10 秒 …
        3. 点停止 …
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 相关日志（可选）
      description: 从程序目录的 RecLite.log 复制相关的几行。**贴之前删掉含个人路径的行。**
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已升级到最新 Release 版本后仍然能复现
          required: true
        - label: 日志中没有包含个人隐私信息
          required: true
