name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译检查（net48 / x64）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 编译 Release
        run: dotnet build src/RecLite.csproj -c Release --nologo

      - name: 校验产物自足（解码库与托管依赖已内嵌）
        shell: pwsh
        run: |
          $exe = 'src/bin/Release/RecLite.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::没找到 $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          Write-Host ("RecLite.exe {0:N2} MB" -f ($size / 1MB))
          if ($size -lt 2MB) {
            Write-Host "::error::产物偏小，内嵌资源可能缺失"
            exit 1
          }
          $asm = [System.Reflection.Assembly]::LoadFile((Resolve-Path $exe).Path)
          $res = $asm.GetManifestResourceNames()
          foreach ($need in @('Bundled.sndfile.dll', 'Bundled.NAudio.dll')) {
            if ($res -notcontains $need) {
              Write-Host "::error::缺少内嵌资源 $need，单文件版会在运行时加载失败"
              exit 1
            }
          }
          Write-Host ("内嵌资源 {0} 项，含 sndfile.dll 与 NAudio.dll" -f $res.Count)

      - name: 裁剪预录矩阵回归（不需要声卡）
        shell: pwsh
        run: ./scripts/verify/verify-trim-bits.ps1 -Exe src/bin/Release/RecLite.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: RecLite-exe
          path: src/bin/Release/RecLite.exe
          if-no-files-found: error
