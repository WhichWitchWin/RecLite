name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译检查（net48 / x64）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查脚本编码（.ps1 必须 UTF-8 with BOM）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell 5.1 见到无 BOM 的 UTF-8 会按 ANSI(cp936) 读，中文注释与字符串全乱，
          # 严重时直接语法错误。这条检查防的就是「编辑器工具把 BOM 顺手抹掉」。
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\|\\bin\\|\\obj\\' } |
            ForEach-Object {
              $b = [System.IO.File]::ReadAllBytes($_.FullName)
              $isUtf8Bom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
              if (-not $isUtf8Bom) { $bad += $_.FullName }
            }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::.ps1 必须存成 UTF-8 with BOM（PowerShell 5.1 下无 BOM 会乱码）：$_" }
            exit 1
          }
          Write-Host "全部 .ps1 均为 UTF-8 with BOM ✅"

      - name: 安装 .NET SDK 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: 编译 Release
        run: dotnet build src/RecLite.csproj -c Release --nologo

      - name: 校验产物自足（解码库与托管依赖已内嵌）
        shell: pwsh
        run: |
          $exe = 'src/bin/Release/RecLite.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::没找到 $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          Write-Host ("RecLite.exe {0:N2} MB" -f ($size / 1MB))
          if ($size -lt 2MB) {
            Write-Host "::error::产物偏小，内嵌资源可能缺失"
            exit 1
          }
          $asm = [System.Reflection.Assembly]::LoadFile((Resolve-Path $exe).Path)
          $res = $asm.GetManifestResourceNames()
          foreach ($need in @('Bundled.sndfile.dll', 'Bundled.NAudio.dll')) {
            if ($res -notcontains $need) {
              Write-Host "::error::缺少内嵌资源 $need，单文件版会在运行时加载失败"
              exit 1
            }
          }
          Write-Host ("内嵌资源 {0} 项，含 sndfile.dll 与 NAudio.dll" -f $res.Count)

      - name: 裁剪预录矩阵回归（不需要声卡）
        shell: pwsh
        run: ./scripts/verify/verify-trim-bits.ps1 -Exe src/bin/Release/RecLite.exe

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: RecLite-exe
          path: src/bin/Release/RecLite.exe
          if-no-files-found: error
