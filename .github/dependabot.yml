version: 2
updates:
  # 保持 GitHub Actions 版本不落伍（工作流里用的 checkout / setup-dotnet / upload-artifact）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # 只做版本提醒，不自动合并：NAudio 升级要同步更新 src/lib/bundled 里内嵌的 dll
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
