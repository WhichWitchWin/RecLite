version: 2
updates:
  # 保持 GitHub Actions 版本不落伍（工作流里用的 checkout / setup-dotnet / upload-artifact）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # 只做版本提醒，不自动合并：NAudio 升级要同步更新 src/lib/bundled 里内嵌的 dll
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    # NAudio 以二进制内嵌在 exe 里（src/lib/bundled/，10 个 dll），升级必须同步换 dll
    # 并跑真声卡冒烟，不适合由机器人按月提醒，等出现安全公告时再升。
    # 注意：安全更新（Dependabot security updates）不受这里的 ignore 影响，会照常另开 PR。
    ignore:
      - dependency-name: "NAudio"
